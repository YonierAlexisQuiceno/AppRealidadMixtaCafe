<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUBIT - Realidad Aumentada</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; margin: 0; overflow: hidden; }
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        #ui-overlay * { pointer-events: auto; }
        .glass-panel {
            background: rgba(0, 51, 102, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-gamer {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 0 #cc7000;
        }
        .btn-gamer:active { transform: translateY(4px); box-shadow: none; }
        .btn-active { background: #FF8C00 !important; color: white !important; }
    </style>
</head>
<body>

    <!-- ESCENA AR -->
    <a-scene
        id="ar-scene"
        loading-screen="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false"
        renderer="alpha: true; colorManagement: true;"
        embedded
        model-switcher
    >
        <a-assets timeout="60000">
            <a-asset-item id="model-maquina" src="assets/Despulpadora.glb"></a-asset-item>
            <a-asset-item id="cafe-obj" src="assets/10177_CoffeeBean_v01_it2.obj"></a-asset-item>
            <a-asset-item id="cafe-mtl" src="assets/10177_CoffeeBean_v01_it2.mtl"></a-asset-item>
        </a-assets>

        <!-- LUCES OPTIMIZADAS -->
        <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
        <a-light type="directional" position="1 2 1" intensity="0.8"></a-light>

        <!-- MARCADOR PERSONALIZADO -->
        <a-marker type="pattern" url="assets/pattern-tarjeta.patt" id="marker-tarjeta" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
            <!-- MAQUINARIA (Despulpadora) -->
            <a-entity 
                id="entity-maquina"
                gltf-model="#model-maquina" 
                scale="0.08 0.08 0.08" 
                position="0 0 0"
                rotation="-90 0 0"
                animation="property: rotation; from: -90 0 0; to: -90 360 0; loop: true; dur: 15000; easing: linear"
                visible="true">
            </a-entity>

            <!-- GRANO DE CAFÉ (OBJ) -->
            <a-entity 
                id="entity-grano"
                obj-model="obj: #cafe-obj; mtl: #cafe-mtl"
                scale="0.005 0.005 0.005"
                position="0 0 0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
                visible="false">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- UI SUPERPUESTA -->
    <div id="ui-overlay">
        <!-- HEADER -->
        <header class="bg-[#003366]/80 backdrop-blur-md text-white p-3 flex justify-between items-center border-b-4 border-[#FF8C00]">
            <a href="index.html" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg font-bold flex items-center gap-2 no-underline text-white transition-colors">
                ← Menú
            </a>
            <div class="text-center">
                <h1 id="ar-title" class="font-black italic tracking-tighter text-lg md:text-2xl text-[#FF8C00]">📱 REALIDAD AUMENTADA</h1>
                <p class="text-[10px] tracking-[0.3em] uppercase opacity-60">Apunta a la tarjeta del proyecto</p>
            </div>
            <button id="toggleFullscreen" class="bg-white/10 hover:bg-white/20 p-2 rounded-full transition-colors">🖥️</button>
        </header>

        <!-- FOOTER: Selector de modelo -->
        <footer class="p-4 flex flex-col items-center gap-3">
            <!-- INSTRUCCIÓN -->
            <div id="instruction" class="glass-panel px-4 py-2 rounded-xl text-white/80 text-sm text-center">
                📌 Imprime o muestra la tarjeta y apunta la cámara hacia ella
            </div>

            <!-- SELECTOR DE MODELO -->
            <div class="flex gap-3">
                <button id="btn-maquina" onclick="showModel('maquina')" class="glass-panel px-6 py-3 rounded-2xl font-bold text-white hover:bg-[#FF8C00]/30 transition-colors flex items-center gap-2 btn-active">
                    ⚙️ Maquinaria
                </button>
                <button id="btn-grano" onclick="showModel('grano')" class="glass-panel px-6 py-3 rounded-2xl font-bold text-white hover:bg-[#FF8C00]/30 transition-colors flex items-center gap-2">
                    🌱 Grano
                </button>
                <a href="vr.html" class="glass-panel px-6 py-3 rounded-2xl font-bold text-[#00c2ff] hover:bg-white/10 transition-colors no-underline flex items-center gap-2">
                    🏞️ Ir a 360°
                </a>
            </div>
        </footer>
    </div>

    <script>
        // Componente ECS para manejar el modelo 3D
        AFRAME.registerComponent('model-switcher', {
            init: function () {
                this.maquina = document.querySelector('#entity-maquina');
                this.grano = document.querySelector('#entity-grano');
                this.el.addEventListener('switch-model', (e) => {
                    let type = e.detail.type;
                    this.maquina.setAttribute('visible', type === 'maquina');
                    this.grano.setAttribute('visible', type === 'grano');
                });
            }
        });

        function showModel(type) {
            // 1. Disparar evento al componente ECS para separar lógica 3D de UI
            document.querySelector('#ar-scene').emit('switch-model', {type: type});
            
            // 2. Actualizar estado de UI HTML
            const btnMaquina = document.getElementById('btn-maquina');
            const btnGrano = document.getElementById('btn-grano');
            const title = document.getElementById('ar-title');

            if (type === 'maquina') {
                btnMaquina.classList.add('btn-active');
                btnGrano.classList.remove('btn-active');
                title.innerText = "⚙️ DESPULPADORA";
            } else {
                btnGrano.classList.add('btn-active');
                btnMaquina.classList.remove('btn-active');
                title.innerText = "🌱 GRANO DE CAFÉ";
            }
        }

        // Fullscreen
        document.getElementById('toggleFullscreen').addEventListener('click', () => {
            let elem = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        });

        // Log de carga
        document.getElementById('model-maquina').addEventListener('loaded', () => console.log('✅ Despulpadora cargada'));
    </script>
</body>
</html>
